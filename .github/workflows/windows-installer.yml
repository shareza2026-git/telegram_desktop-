name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install backend dependencies
        run: python -m pip install -e ".[test,package]"

      - name: Test backend
        run: python -m pytest -q

      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Build private backend sidecar
        run: pyinstaller --noconfirm --clean --onefile --name telegram-desktop-backend --collect-all uvicorn app/desktop.py

      - name: Smoke test packaged backend
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:RUNNER_TEMP "telegram-desktop-smoke"
          $backend = Resolve-Path "dist/telegram-desktop-backend.exe"
          $process = Start-Process -FilePath $backend -ArgumentList @("--data-root", "`"$dataRoot`"") -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8110/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) {
              throw "Packaged backend did not become healthy"
            }
            if (-not (Test-Path (Join-Path $dataRoot "accounts/default/client.db"))) {
              throw "Packaged backend did not create its private database"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Stage sidecar for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/src-tauri/binaries | Out-Null
          Copy-Item dist/telegram-desktop-backend.exe frontend/src-tauri/binaries/telegram-desktop-backend-x86_64-pc-windows-msvc.exe

      - name: Stage Xray core for VLESS
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "Xray-windows-64.zip"
          $out = Join-Path $env:RUNNER_TEMP "xray-core"
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v26.9.9/Xray-windows-64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $xray = Join-Path $out "xray.exe"
          if (-not (Test-Path $xray)) {
            throw "xray.exe was not found in the pinned Xray release"
          }
          & $xray version
          if ($LASTEXITCODE -ne 0) {
            throw "xray.exe failed its version smoke test"
          }
          Copy-Item $xray frontend/src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe -Force

      - name: Build NSIS installer
        working-directory: frontend
        run: npm run tauri build -- --config src-tauri/tauri.windows.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-desktop-windows-installer
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: build-windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: telegram-desktop-windows-installer
          path: release

      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="${GITHUB_REF_NAME#release/}"
          fi
          gh release create "$release_tag" release/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Telegram Desktop $release_tag" \
            --generate-notes
