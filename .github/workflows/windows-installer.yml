name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}
      artifact_name: ${{ steps.release_version.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release tag source
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git fetch origin +refs/heads/feature/telegram-desktop-foundation:refs/remotes/origin/feature/telegram-desktop-foundation --no-tags
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch development branch" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/feature/telegram-desktop-foundation
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit from feature/telegram-desktop-foundation"
          }

      - name: Resolve release version
        id: release_version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw "Release tag must be vMAJOR.MINOR.PATCH"
            }
            $version = $tag.Substring(1)
            python scripts/sync-version.py --set $version
            if ($LASTEXITCODE -ne 0) { throw "Could not synchronize release version" }
          } else {
            $version = (python scripts/sync-version.py --check).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Checked-in release versions are inconsistent" }
          }
          $verified = (python scripts/sync-version.py --check).Trim()
          if ($LASTEXITCODE -ne 0 -or $verified -ne $version) {
            throw "Release version verification failed"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=telegram-desktop-windows-v$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install backend dependencies
        run: python -m pip install -e ".[test,package]"

      - name: Test backend
        run: python -m pytest -q

      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Build private backend sidecar
        run: pyinstaller --noconfirm --clean --onefile --name telegram-desktop-backend --collect-all uvicorn app/desktop.py

      - name: Smoke test packaged backend
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:RUNNER_TEMP "telegram-desktop-smoke"
          $backend = Resolve-Path "dist/telegram-desktop-backend.exe"
          $process = Start-Process -FilePath $backend -ArgumentList @("--data-root", "`"$dataRoot`"") -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8110/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) {
              throw "Packaged backend did not become healthy"
            }
            if (-not (Test-Path (Join-Path $dataRoot "accounts/default/client.db"))) {
              throw "Packaged backend did not create its private database"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Stage sidecar for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/src-tauri/binaries | Out-Null
          Copy-Item dist/telegram-desktop-backend.exe frontend/src-tauri/binaries/telegram-desktop-backend-x86_64-pc-windows-msvc.exe

      - name: Stage Xray core for VLESS
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "Xray-windows-64.zip"
          $out = Join-Path $env:RUNNER_TEMP "xray-core"
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v26.9.9/Xray-windows-64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $xray = Join-Path $out "xray.exe"
          if (-not (Test-Path $xray)) {
            throw "xray.exe was not found in the pinned Xray release"
          }
          & $xray version
          if ($LASTEXITCODE -ne 0) {
            throw "xray.exe failed its version smoke test"
          }
          Copy-Item $xray frontend/src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe -Force

      - name: Build NSIS installer
        working-directory: frontend
        run: npm run tauri build -- --config src-tauri/tauri.windows.conf.json

      - name: Stage versioned installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          New-Item -ItemType Directory -Force release-artifact | Out-Null
          $target = Join-Path "release-artifact" "Telegram-Desktop-Setup-v${{ steps.release_version.outputs.version }}.exe"
          Copy-Item $installer.FullName $target -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_version.outputs.artifact_name }}
          path: release-artifact/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.ref_type == 'tag'
    needs: build-windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows-installer.outputs.artifact_name }}
          path: release

      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$GITHUB_REF_NAME"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" release/*.exe --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" release/*.exe \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Telegram Desktop $release_tag" \
              --generate-notes
          fi
