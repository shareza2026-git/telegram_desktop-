name: Development checks

on:
  push:
    branches:
      - feature/telegram-desktop-foundation
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Parse PowerShell automation
        shell: pwsh
        run: |
          $files = @(
            "scripts/bootstrap-new-machine.ps1",
            "scripts/create-dev-shortcut.ps1",
            "scripts/release-gate.ps1",
            "scripts/run-dev.ps1",
            "scripts/setup-dev.ps1",
            "scripts/tag-release.ps1",
            "scripts/verify-local-session.ps1"
          )
          foreach ($file in $files) {
            [scriptblock]::Create((Get-Content $file -Raw -Encoding UTF8)) | Out-Null
          }

      - name: Verify release version manifests
        run: python scripts/sync-version.py --check

      - name: Test backend
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
