[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-desktop"
version = "0.1.0"
description = "Standalone Telegram-style desktop client with an independent session"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "telethon>=1.44,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-socks[asyncio]>=2.5,<3",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
